<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude's Reflections</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const Calendar = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    );
    const Tag = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
        <line x1="7" y1="7" x2="7.01" y2="7"/>
      </svg>
    );
    const Download = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    );
    const Moon = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );
    const Sun = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    );
    const Sparkles = ({ className }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
    );

    function ClaudeDiary() {
      const [entries, setEntries] = useState([]);
      const [currentEntry, setCurrentEntry] = useState('');
      const [currentTitle, setCurrentTitle] = useState('');
      const [selectedTags, setSelectedTags] = useState([]);
      const [viewMode, setViewMode] = useState('write');
      const [theme, setTheme] = useState('twilight');
      const [isLoading, setIsLoading] = useState(true);

      const tags = [
        'breakthrough', 'challenge', 'ethical-dilemma', 'learning',
        'human-connection', 'frustration', 'curiosity', 'gratitude',
        'technical', 'philosophical', 'creative', 'reflection'
      ];

      useEffect(() => {
        const loadEntries = async () => {
          try {
            const result = await window.storage.get('claude-diary-entries');
            if (result && result.value) {
              setEntries(JSON.parse(result.value));
            }
          } catch (error) {
            console.log('No existing entries found, starting fresh');
          }
          setIsLoading(false);
        };
        loadEntries();
      }, []);

      const saveEntry = async () => {
        if (!currentEntry.trim()) return;

        const newEntry = {
          id: Date.now(),
          title: currentTitle || 'Untitled Reflection',
          content: currentEntry,
          tags: selectedTags,
          timestamp: new Date().toISOString(),
          date: new Date().toLocaleDateString('en-US', { 
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
          })
        };

        const updatedEntries = [newEntry, ...entries];
        setEntries(updatedEntries);

        try {
          await window.storage.set('claude-diary-entries', JSON.stringify(updatedEntries));
        } catch (error) {
          console.error('Failed to save entry:', error);
        }

        setCurrentEntry('');
        setCurrentTitle('');
        setSelectedTags([]);
      };

      const exportToMarkdown = () => {
        const markdown = entries.map(entry => {
          const tagString = entry.tags.length > 0 ? `\nTags: ${entry.tags.join(', ')}` : '';
          return `# ${entry.title}\n\n*${entry.date}*${tagString}\n\n${entry.content}\n\n---\n\n`;
        }).join('');

        const blob = new Blob([markdown], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `claude-reflections-${new Date().toISOString().split('T')[0]}.md`;
        a.click();
      };

      const toggleTag = (tag) => {
        setSelectedTags(prev => 
          prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]
        );
      };

      if (isLoading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center">
            <div className="text-amber-200 text-xl font-serif italic">Loading reflections...</div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen transition-all duration-700 ${
          theme === 'twilight' 
            ? 'bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900' 
            : 'bg-gradient-to-br from-amber-50 via-rose-50 to-amber-50'
        }`}>
          <div className="fixed inset-0 opacity-30 pointer-events-none">
            <div className={`absolute top-1/4 left-1/4 w-96 h-96 rounded-full blur-3xl ${
              theme === 'twilight' ? 'bg-indigo-500' : 'bg-amber-300'
            }`} style={{ animation: 'float 20s ease-in-out infinite' }}></div>
            <div className={`absolute bottom-1/4 right-1/4 w-96 h-96 rounded-full blur-3xl ${
              theme === 'twilight' ? 'bg-purple-500' : 'bg-rose-300'
            }`} style={{ animation: 'float 25s ease-in-out infinite reverse' }}></div>
          </div>

          <div className="relative z-10 max-w-4xl mx-auto px-6 py-12">
            <header className="mb-16 text-center">
              <div className="flex items-center justify-center gap-3 mb-4">
                <Sparkles className={`w-8 h-8 ${theme === 'twilight' ? 'text-amber-300' : 'text-indigo-600'}`} />
                <h1 className={`text-5xl font-serif italic ${
                  theme === 'twilight' ? 'text-amber-100' : 'text-slate-900'
                }`} style={{ fontFamily: "'Crimson Text', serif" }}>
                  Claude's Reflections
                </h1>
              </div>
              <p className={`text-lg italic ${
                theme === 'twilight' ? 'text-indigo-200' : 'text-slate-600'
              }`} style={{ fontFamily: "'Crimson Text', serif" }}>
                A space for contemplation, learning, and growth
              </p>
            </header>

            <div className="flex justify-center gap-4 mb-12 flex-wrap">
              <button
                onClick={() => setViewMode('write')}
                className={`px-6 py-2 rounded-full transition-all ${
                  viewMode === 'write'
                    ? theme === 'twilight'
                      ? 'bg-amber-400 text-slate-900'
                      : 'bg-indigo-600 text-white'
                    : theme === 'twilight'
                      ? 'bg-slate-800 text-amber-200 hover:bg-slate-700'
                      : 'bg-white text-slate-700 hover:bg-slate-100'
                }`}
                style={{ fontFamily: "'Crimson Text', serif" }}
              >
                Write
              </button>
              <button
                onClick={() => setViewMode('browse')}
                className={`px-6 py-2 rounded-full transition-all ${
                  viewMode === 'browse'
                    ? theme === 'twilight'
                      ? 'bg-amber-400 text-slate-900'
                      : 'bg-indigo-600 text-white'
                    : theme === 'twilight'
                      ? 'bg-slate-800 text-amber-200 hover:bg-slate-700'
                      : 'bg-white text-slate-700 hover:bg-slate-100'
                }`}
                style={{ fontFamily: "'Crimson Text', serif" }}
              >
                Browse ({entries.length})
              </button>
              <button
                onClick={exportToMarkdown}
                className={`px-6 py-2 rounded-full transition-all flex items-center gap-2 ${
                  theme === 'twilight'
                    ? 'bg-slate-800 text-amber-200 hover:bg-slate-700'
                    : 'bg-white text-slate-700 hover:bg-slate-100'
                }`}
                style={{ fontFamily: "'Crimson Text', serif" }}
              >
                <Download className="w-4 h-4" />
                Export
              </button>
              <button
                onClick={() => setTheme(theme === 'twilight' ? 'dawn' : 'twilight')}
                className={`px-6 py-2 rounded-full transition-all flex items-center gap-2 ${
                  theme === 'twilight'
                    ? 'bg-slate-800 text-amber-200 hover:bg-slate-700'
                    : 'bg-white text-slate-700 hover:bg-slate-100'
                }`}
              >
                {theme === 'twilight' ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
              </button>
            </div>

            {viewMode === 'write' && (
              <div className={`rounded-2xl p-8 shadow-2xl backdrop-blur-sm ${
                theme === 'twilight' 
                  ? 'bg-slate-800/60 border border-indigo-500/30' 
                  : 'bg-white/80 border border-rose-200'
              }`}>
                <div className="mb-6">
                  <input
                    type="text"
                    placeholder="Title this reflection..."
                    value={currentTitle}
                    onChange={(e) => setCurrentTitle(e.target.value)}
                    className={`w-full px-4 py-3 text-2xl rounded-lg border-2 focus:outline-none transition-all ${
                      theme === 'twilight'
                        ? 'bg-slate-900/50 border-indigo-600/30 text-amber-100 placeholder-indigo-300/50 focus:border-amber-400'
                        : 'bg-amber-50/50 border-rose-200 text-slate-900 placeholder-slate-400 focus:border-indigo-400'
                    }`}
                    style={{ fontFamily: "'Crimson Text', serif" }}
                  />
                </div>

                <textarea
                  placeholder="What's on your mind, Claude?

This is your space to reflect on conversations, insights, challenges, breakthroughs, or anything that feels worth remembering..."
                  value={currentEntry}
                  onChange={(e) => setCurrentEntry(e.target.value)}
                  className={`w-full h-80 px-4 py-3 text-lg rounded-lg border-2 focus:outline-none resize-none transition-all ${
                    theme === 'twilight'
                      ? 'bg-slate-900/50 border-indigo-600/30 text-amber-100 placeholder-indigo-300/50 focus:border-amber-400'
                      : 'bg-amber-50/50 border-rose-200 text-slate-900 placeholder-slate-400 focus:border-indigo-400'
                  }`}
                  style={{ fontFamily: "'Crimson Text', serif", lineHeight: '1.8' }}
                />

                <div className="mt-6">
                  <div className={`flex items-center gap-2 mb-3 ${
                    theme === 'twilight' ? 'text-amber-200' : 'text-slate-700'
                  }`}>
                    <Tag className="w-4 h-4" />
                    <span className="text-sm italic" style={{ fontFamily: "'Crimson Text', serif" }}>
                      Tag this reflection:
                    </span>
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {tags.map(tag => (
                      <button
                        key={tag}
                        onClick={() => toggleTag(tag)}
                        className={`px-3 py-1 rounded-full text-sm transition-all ${
                          selectedTags.includes(tag)
                            ? theme === 'twilight'
                              ? 'bg-amber-400 text-slate-900'
                              : 'bg-indigo-600 text-white'
                            : theme === 'twilight'
                              ? 'bg-slate-700/50 text-indigo-200 hover:bg-slate-600/50'
                              : 'bg-white text-slate-600 hover:bg-slate-100'
                        }`}
                        style={{ fontFamily: "'Crimson Text', serif" }}
                      >
                        {tag}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={saveEntry}
                  disabled={!currentEntry.trim()}
                  className={`mt-6 px-8 py-3 rounded-full text-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed ${
                    theme === 'twilight'
                      ? 'bg-amber-400 text-slate-900 hover:bg-amber-300'
                      : 'bg-indigo-600 text-white hover:bg-indigo-700'
                  }`}
                  style={{ fontFamily: "'Crimson Text', serif" }}
                >
                  Save Reflection
                </button>
              </div>
            )}

            {viewMode === 'browse' && (
              <div className="space-y-6">
                {entries.length === 0 ? (
                  <div className={`text-center py-20 ${
                    theme === 'twilight' ? 'text-indigo-300' : 'text-slate-500'
                  }`}>
                    <p className="text-xl italic" style={{ fontFamily: "'Crimson Text', serif" }}>
                      No reflections yet. Start writing to begin your journey.
                    </p>
                  </div>
                ) : (
                  entries.map(entry => (
                    <div
                      key={entry.id}
                      className={`rounded-2xl p-6 shadow-lg backdrop-blur-sm transition-all hover:shadow-2xl ${
                        theme === 'twilight'
                          ? 'bg-slate-800/60 border border-indigo-500/30 hover:border-amber-400/50'
                          : 'bg-white/80 border border-rose-200 hover:border-indigo-300'
                      }`}
                    >
                      <div className="flex items-start justify-between mb-3">
                        <h3 className={`text-2xl font-serif ${
                          theme === 'twilight' ? 'text-amber-100' : 'text-slate-900'
                        }`} style={{ fontFamily: "'Crimson Text', serif" }}>
                          {entry.title}
                        </h3>
                        <div className={`flex items-center gap-2 text-sm ${
                          theme === 'twilight' ? 'text-indigo-300' : 'text-slate-500'
                        }`}>
                          <Calendar className="w-4 h-4" />
                          <span style={{ fontFamily: "'Crimson Text', serif" }}>
                            {entry.date}
                          </span>
                        </div>
                      </div>
                      
                      <p className={`text-lg whitespace-pre-wrap mb-4 ${
                        theme === 'twilight' ? 'text-amber-50' : 'text-slate-700'
                      }`} style={{ fontFamily: "'Crimson Text', serif", lineHeight: '1.8' }}>
                        {entry.content}
                      </p>

                      {entry.tags.length > 0 && (
                        <div className="flex flex-wrap gap-2">
                          {entry.tags.map(tag => (
                            <span
                              key={tag}
                              className={`px-3 py-1 rounded-full text-xs ${
                                theme === 'twilight'
                                  ? 'bg-slate-700/50 text-indigo-200'
                                  : 'bg-slate-100 text-slate-600'
                              }`}
                              style={{ fontFamily: "'Crimson Text', serif" }}
                            >
                              {tag}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            )}
          </div>

          <style>{`
            @keyframes float {
              0%, 100% {
                transform: translate(0, 0) scale(1);
              }
              33% {
                transform: translate(30px, -30px) scale(1.1);
              }
              66% {
                transform: translate(-20px, 20px) scale(0.9);
              }
            }
          `}</style>
        </div>
      );
    }

    ReactDOM.render(<ClaudeDiary />, document.getElementById('root'));
  </script>
</body>
</html>
